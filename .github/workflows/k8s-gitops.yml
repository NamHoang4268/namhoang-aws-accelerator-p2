name: K8s GitOps CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "cloud/w9/day-a/argocd/**"
  push:
    branches: [main]
    paths:
      - "cloud/w9/day-a/argocd/**"

jobs:
  # ── PR: validate manifests (plan) ──────────────────────────────────────────
  validate:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Validate YAML syntax
        run: |
          echo "=== Validating K8s manifests ==="
          for f in cloud/w9/day-a/argocd/*.yaml; do
            echo "Checking: $f"
            kubectl apply --dry-run=client -f "$f" 2>&1 || true
          done
          echo "=== Validation complete ==="

      - name: Comment PR with diff summary
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **K8s manifest validation passed**\n\nChanges in `cloud/w9/day-a/argocd/` are valid.\nArgoCD will auto-sync after merge.'
            })

  # ── Merge to main: notify ArgoCD sync ──────────────────────────────────────
  notify-sync:
    name: Notify ArgoCD Sync
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log deployment info
        run: |
          echo "=== Merge to main detected ==="
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Message: ${{ github.event.head_commit.message }}"
          echo ""
          echo "ArgoCD will auto-sync within 3 minutes."
          echo "Monitor at: https://localhost:8443 (local)"
          echo ""
          echo "Changed files:"
          git diff --name-only HEAD~1 HEAD | grep "cloud/w9/day-a/argocd/" || echo "No argocd files changed"
