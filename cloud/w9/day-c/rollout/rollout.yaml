# Argo Rollouts — Rollout CRD
# Thay thế Deployment thông thường, thêm canary strategy
#
# Khác Deployment ở chỗ:
# - apiVersion: argoproj.io/v1alpha1 (không phải apps/v1)
# - kind: Rollout (không phải Deployment)
# - Có thêm spec.strategy để kiểm soát cách deploy

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-w9-rollout
  namespace: hello-w9
spec:
  replicas: 5
  selector:
    matchLabels:
      app: hello-w9
  template:
    metadata:
      labels:
        app: hello-w9
    spec:
      containers:
      - name: hello-w9
        image: nginx:1.25    # version hiện tại (stable)
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

  # Canary strategy — deploy dần dần, phân tích trước khi tiến
  strategy:
    canary:
      # Service riêng cho canary (nhận traffic từ canary pods)
      canaryService: hello-w9-canary-svc
      # Service cho stable (nhận traffic từ stable pods)
      stableService: hello-w9-stable-svc

      # AnalysisTemplate dùng để evaluate canary
      analysis:
        templates:
        - templateName: hello-w9-success-rate
        startingStep: 2     # bắt đầu analyze từ step thứ 2

      # Steps — từng bước rollout canary
      steps:
      # Bước 1: gửi 20% traffic vào canary
      - setWeight: 20
      # Bước 2: dừng 60 giây, chạy analysis
      - pause:
          duration: 60s
      # Bước 3: tăng lên 40%
      - setWeight: 40
      # Bước 4: dừng 60 giây, tiếp tục analysis
      - pause:
          duration: 60s
      # Bước 5: tăng lên 60%
      - setWeight: 60
      # Bước 6: dừng 60 giây
      - pause:
          duration: 60s
      # Bước 7: tăng lên 80%
      - setWeight: 80
      # Bước 8: dừng lần cuối
      - pause:
          duration: 60s
      # Bước 9: 100% — promote hoàn toàn
      # (tự động nếu analysis pass, manual nếu không cấu hình)
