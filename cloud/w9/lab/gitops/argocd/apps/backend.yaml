apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: backend
    namespace: argocd
spec:
    project: default
    source:
        repoURL: https://github.com/NamHoang4268/namhoang-aws-accelerator-p2
        targetRevision: main
        path: cloud/w9/lab/gitops/k8s/backend
    destination:
        server: https://kubernetes.default.svc
        namespace: demo
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
