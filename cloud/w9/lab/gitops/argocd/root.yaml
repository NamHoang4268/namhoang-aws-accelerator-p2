apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: root
    namespace: argocd
spec:
    project: default
    source:
        repoURL: https://github.com/NamHoang4268/namhoang-aws-accelerator-p2
        targetRevision: main
        path: cloud/w9/lab/gitops/argocd/apps
    destination:
        server: https://kubernetes.default.svc
        namespace: argocd
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
