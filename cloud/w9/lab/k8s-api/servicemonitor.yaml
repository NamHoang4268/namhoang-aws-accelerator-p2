apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    name: api-monitor
    namespace: demo
    labels:
        release: kube-prometheus-stack # label này giúp Prometheus operator phát hiện ra ServiceMonitor
spec:
    selector:
        matchLabels:
            app: api
    endpoints:
        - port: http
          path: /metrics
          interval: 15s
